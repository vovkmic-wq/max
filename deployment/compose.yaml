services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: max_agent
      POSTGRES_USER: max_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U max_agent -d max_agent"]
      interval: 10s
      timeout: 5s
      retries: 10
  agent:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set postgresql+psycopg URL}
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:?Set owner panel secret}
      APP_EDITOR_SECRET: ${APP_EDITOR_SECRET:-}
      APP_VIEWER_SECRET: ${APP_VIEWER_SECRET:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-}
      OPENCODE_AUTH_SECRET: ${OPENCODE_AUTH_SECRET:-}
      OPENCODE_MODEL_ID: ${OPENCODE_MODEL_ID:-}
    volumes:
      - ../TOPIC.md:/app/TOPIC.md:ro
      - ../config/app.json:/app/config/app.json:ro
      - ../config/sources.json:/app/config/sources.json:ro
      - state:/app/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  state:
